name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Nilai dummy, hanya agar `prisma validate` dan test otentikasi bisa berjalan di CI.
      DATABASE_URL: postgresql://user:pass@localhost:5432/db
      DIRECT_URL: postgresql://user:pass@localhost:5432/db
      SUPABASE_JWT_SECRET: test-secret-key-for-vitest-and-ci-testing-minimum-32-chars-long

    steps:
      - uses: actions/checkout@v4

      # Versi pnpm dibaca dari field "packageManager" di package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # pnpm v12: build scripts (prisma, esbuild, dll) harus di-approve eksplisit
      - name: Approve build scripts
        run: pnpm approve-builds --all

      - name: Prisma validate & generate
        run: |
          pnpm --filter api prisma:validate
          pnpm --filter api prisma:generate

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
