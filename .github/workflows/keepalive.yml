name: Keepalive

# Mencegah project Supabase Free di-pause (RSK-04) dan memantau API.
# Set repository variable API_BASE_URL, contoh: https://api-vokalink.example.com

on:
  schedule:
    - cron: "0 3 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /readyz
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "Repository variable API_BASE_URL belum diisi."
            exit 1
          fi
          curl --fail --silent --show-error --max-time 30 "$API_BASE_URL/readyz"
