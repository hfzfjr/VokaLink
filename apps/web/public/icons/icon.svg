<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#grad)" />
  
  <!-- Subtle border highlight -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="8" />

  <!-- Monogram VL -->
  <g filter="url(#shadow)">
    <!-- Letter V -->
    <path d="M 110 140 L 210 380 L 270 380 L 190 140 Z" fill="#ffffff" />
    <!-- Letter L -->
    <path d="M 270 140 L 270 380 L 410 380 L 410 320 L 330 320 L 330 140 Z" fill="#facc15" />
  </g>
  
  <!-- Star accent -->
  <circle cx="390" cy="160" r="20" fill="#38bdf8" />
</svg>
